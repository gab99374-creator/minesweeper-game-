<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minesweeper</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}

.game {
    width: 95%;
    max-width: 600px;
    text-align: center;
}

h1 {
    font-size: 42px;
    margin: 10px 0;
}

.subtitle {
    color: #b8c4d6;
    margin-bottom: 20px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

select,
button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

select {
    background: #26364d;
    color: white;
}

#restart {
    background: #35d06f;
    color: white;
}

.stats {
    display: flex;
    justify-content: space-between;
    background: #1d2a3c;
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 15px;
}

#board {
    display: grid;
    gap: 5px;
    width: fit-content;
    max-width: 100%;
    margin: auto;
    padding: 7px;
    background: #080d16;
    border-radius: 12px;
}

.cell {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 8px;

    background: #354862;
    color: white;

    font-size: 25px;

    cursor: pointer;

    transition: transform .1s, background .15s;
}

.cell:hover {
    transform: scale(1.05);
    background: #48617f;
}

.cell.revealed {
    background: #d9dee5;
}

.cell.mine {
    background: #ff3b30;
}

.cell.flag {
    background: #354862;
}

.message {
    min-height: 30px;
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
}

/* RAINBOW GAME OVER */

#gameOver {
    position: fixed;
    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    text-align: center;

    z-index: 999;

    animation: rainbow 0.7s infinite linear;
}

@keyframes rainbow {

    0% {
        background: #ff0000;
    }

    16% {
        background: #ff7a00;
    }

    33% {
        background: #ffee00;
    }

    50% {
        background: #00ff55;
    }

    66% {
        background: #00aaff;
    }

    83% {
        background: #7a00ff;
    }

    100% {
        background: #ff00aa;
    }
}

.warning {
    width: 90%;
    max-width: 600px;

    padding: 30px;

    background: rgba(0,0,0,.75);

    border-radius: 25px;

    box-shadow:
        0 0 30px white,
        0 0 80px white;

    animation: shake .15s infinite alternate;
}

@keyframes shake {

    from {
        transform: rotate(-2deg) scale(1);
    }

    to {
        transform: rotate(2deg) scale(1.03);
    }
}

.warning h2 {
    font-size: 55px;
    margin: 10px 0;

    text-shadow:
        0 0 10px white,
        0 0 20px white;
}

.warning p {
    font-size: 25px;
}

#tryAgain {
    margin-top: 15px;

    background: white;
    color: black;

    font-size: 18px;
}

@media (max-width: 500px) {

    .cell {
        width: 34px;
        height: 34px;
        font-size: 20px;
    }

    h1 {
        font-size: 34px;
    }

    .warning h2 {
        font-size: 42px;
    }

    .warning p {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>💣 Minesweeper</h1>

    <div class="subtitle">
        Find the safe emojis... 😈
    </div>

    <div class="controls">

        <select id="level">
            <option value="easy">Level One</option>
            <option value="medium">Level Two</option>
            <option value="hard">Level Three</option>
        </select>

        <button id="restart">
            🔄 New Game
        </button>

    </div>

    <div class="stats">

        <span>
            💣 Mines:
            <span id="mineCount">5</span>
        </span>

        <span>
            ⏱️
            <span id="timer">0</span>
        </span>

    </div>

    <div id="board"></div>

    <div id="message" class="message"></div>

</div>


<!-- GAME OVER SOUND -->
<audio id="gameOverSound" preload="auto">
    <source src="gameover.mp3" type="audio/mpeg">
</audio>


<!-- GAME OVER SCREEN -->

<div id="gameOver">

    <div class="warning">

        <div style="font-size:45px;">
            ⚠️ ⚠️ ⚠️
        </div>

        <h2>
            WARNING
        </h2>

        <p>
            😂 JUST KIDDING!
        </p>

        <p>
            YOU GOT PRANKED! 😈
        </p>

        <button id="tryAgain">
            🔄 TRY AGAIN
        </button>

    </div>

</div>


<script>

const boardElement =
    document.getElementById("board");

const levelElement =
    document.getElementById("level");

const restartButton =
    document.getElementById("restart");

const tryAgainButton =
    document.getElementById("tryAgain");

const mineCountElement =
    document.getElementById("mineCount");

const timerElement =
    document.getElementById("timer");

const gameOverElement =
    document.getElementById("gameOver");

const messageElement =
    document.getElementById("message");

const gameOverSound =
    document.getElementById("gameOverSound");


let rows;
let cols;
let mines;

let board = [];

let gameOver = false;
let firstMove = true;

let flags = 0;
let revealed = 0;

let timer = 0;
let timerInterval;


const emojis = [
    "😀",
    "😎",
    "😂",
    "🤪",
    "😈",
    "👽",
    "🤖",
    "🐸",
    "🐵",
    "👻",
    "💀",
    "🤡"
];


function setupLevel() {

    const level =
        levelElement.value;

    if (level === "easy") {

        rows = 6;
        cols = 6;
        mines = 5;

    }

    else if (level === "medium") {

        rows = 8;
        cols = 8;
        mines = 10;

    }

    else {

        rows = 10;
        cols = 10;
        mines = 20;

    }
}


function startGame() {

    clearInterval(timerInterval);

    setupLevel();

    board = [];

    gameOver = false;
    firstMove = true;

    flags = 0;
    revealed = 0;

    timer = 0;

    timerElement.textContent = "0";

    mineCountElement.textContent =
        mines;

    messageElement.textContent = "";

    gameOverElement.style.display =
        "none";


    gameOverSound.pause();
    gameOverSound.currentTime = 0;


    for (let r = 0; r < rows; r++) {

        board[r] = [];

        for (let c = 0; c < cols; c++) {

            board[r][c] = {

                mine: false,

                revealed: false,

                flag: false,

                emoji:
                    emojis[
                        Math.floor(
                            Math.random() *
                            emojis.length
                        )
                    ]

            };

        }

    }

    createBoard();
}


function createBoard() {

    boardElement.innerHTML = "";

    boardElement.style.gridTemplateColumns =
        `repeat(${cols}, 42px)`;


    for (let r = 0; r < rows; r++) {

        for (let c = 0; c < cols; c++) {

            const cell =
                document.createElement("button");

            cell.className = "cell";

            cell.addEventListener(
                "click",
                () => reveal(r, c)
            );

            cell.addEventListener(
                "contextmenu",
                (event) => {

                    event.preventDefault();

                    flagCell(r, c);

                }
            );

            boardElement.appendChild(cell);

        }

    }

}


function placeMines(safeR, safeC) {

    let placed = 0;

    while (placed < mines) {

        const r =
            Math.floor(
                Math.random() * rows
            );

        const c =
            Math.floor(
                Math.random() * cols
            );


        if (board[r][c].mine)
            continue;


        if (r === safeR && c === safeC)
            continue;


        board[r][c].mine = true;

        placed++;

    }

}


function reveal(r, c) {

    if (gameOver)
        return;


    const cell =
        board[r][c];


    if (
        cell.revealed ||
        cell.flag
    )
        return;


    if (firstMove) {

        placeMines(r, c);

        firstMove = false;

        timerInterval =
            setInterval(() => {

                timer++;

                timerElement.textContent =
                    timer;

            }, 1000);

    }


    cell.revealed = true;

    revealed++;


    if (cell.mine) {

        loseGame();

        return;

    }


    renderBoard();


    if (
        revealed >=
        rows * cols - mines
    ) {

        winGame();

    }

}


function flagCell(r, c) {

    if (gameOver)
        return;


    const cell =
        board[r][c];


    if (cell.revealed)
        return;


    if (!cell.flag && flags >= mines)
        return;


    cell.flag =
        !cell.flag;


    if (cell.flag)
        flags++;
    else
        flags--;


    mineCountElement.textContent =
        mines - flags;


    renderBoard();

}


function renderBoard() {

    const cells =
        boardElement.children;


    for (
        let r = 0;
        r < rows;
        r++
    ) {

        for (
            let c = 0;
            c < cols;
            c++
        ) {

            const data =
                board[r][c];

            const element =
                cells[
                    r * cols + c
                ];


            element.textContent = "";

            element.className =
                "cell";


            if (data.flag) {

                element.textContent =
                    "🚩";

                element.classList.add(
                    "flag"
                );

            }


            if (data.revealed) {

                element.classList.add(
                    "revealed"
                );


                if (data.mine) {

                    element.textContent =
                        "💣";

                    element.classList.add(
                        "mine"
                    );

                }

                else {

                    element.textContent =
                        data.emoji;

                }

            }

        }

    }

}


function loseGame() {

    gameOver = true;

    clearInterval(timerInterval);


    /* Reveal all tiles */

    for (let r = 0; r < rows; r++) {

        for (let c = 0; c < cols; c++) {

            board[r][c].revealed =
                true;

        }

    }


    renderBoard();


    messageElement.textContent =
        "💥 BOOM!";


    /* Play sound */

    gameOverSound.currentTime = 0;

    gameOverSound.play().catch(() => {});


    /* Rainbow prank */

    setTimeout(() => {

        gameOverElement.style.display =
            "flex";

    }, 300);

}


function winGame() {

    gameOver = true;

    clearInterval(timerInterval);

    messageElement.textContent =
        "🎉 YOU WIN!";

}


restartButton.addEventListener(
    "click",
    startGame
);


tryAgainButton.addEventListener(
    "click",
    startGame
);


levelElement.addEventListener(
    "change",
    startGame
);


startGame();

</script>

</body>
</html>
